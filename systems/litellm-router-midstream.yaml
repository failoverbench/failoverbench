name: litellm-router-midstream
label: "LiteLLM Router + mid-stream continuation (PR #41127, branch build)"
adapter: litellm-router
notes: >-
  BRANCH EVALUATION, NOT A SCORECARD ROW. This config measures BerriAI/litellm PR #41127
  (branch ayushh0110:litellm_midstream_fallback_continuation), which adds opt-in mid-stream
  fallback continuation: a chat stream that breaks after plain assistant text is continued on a
  fallback deployment by sending the partial answer back as an assistant prefill. The code is
  unreleased, so under METHODOLOGY "Which version is scored" it is never scored and never
  published — the LiteLLM Router row keeps whatever the newest release on PyPI earns until a
  release containing this change exists. Results from this file belong in a scratch results
  directory, not in results/<profile>/.
  Settings are the LiteLLM Router baseline (num_retries 2, timeout 30 s, one fallback,
  context_window_fallbacks on) plus router_settings.enable_mid_stream_fallback_continuation.
  The branch picks its continuation target with a pre-call filter that asks the model cost map
  whether the deployment's `litellm_params.model` declares `supports_assistant_prefill`; a
  deployment's own `model_info` block is not consulted, so the wall's custom model names have to
  be registered into the cost map by name. `prefill_capable_models` does that, via
  litellm.register_model in the adapter's start(). fb-ok-noprefill is deliberately left
  undeclared, which is the point of S14: the filter must drop it rather than send it a prefill
  the wall answers with a 400.
  Install: the branch declares litellm 1.102.0, which builds a Rust bridge
  (litellm.rust_bridge._native) through maturin and therefore needs a Rust toolchain. Where none
  is available, install the newest released wheel — 1.101.0, which ships that compiled bridge —
  into a venv of its own, then copy the branch's Python tree over it excluding *.so, so the
  branch's Python runs on the released wheel's compiled bridge. That is how the September 2026
  measurement was taken; it is not a true 1.102.0 build, which is a further reason the numbers
  are not publishable.
params:
  num_retries: 2
  timeout_s: 30
  context_window_fallbacks: true
  enable_mid_stream_fallback_continuation: true
  prefill_capable_models: ["fb-ok"]
