name: bifrost
label: "Bifrost dev @3a6d793 (Docker, source build)"
adapter: endpoint
notes: "Bifrost built from source at maximhq/bifrost dev @3a6d7936bdde29af422b19f395005e2bb4bf6a79 (2026-09-12), the first revision we could measure that contains PR #7104 (merged 2026-09-11, fixes #7034): the streaming client's request timeout now bounds the wait for response headers, and cancelling the request context closes the upstream socket. No published image carries #7104 — the newest Docker Hub tag is v2.1.1 (2026-09-09) and maximhq/bifrost has no dev/main tag — so this row is a local build of transports/Dockerfile.local (image id sha256:065aa8f9; the ordinary transports/Dockerfile pins core v1.8.6 from the proxy and would not contain the fix). Previous row was v2.1.0. Custom provider `fake` (base_provider_type openai, base_url = the wall, allow_private_network on). Baseline settings: max_retries 2 (vendor default is 0), request timeout 30 s, stream idle timeout 30 s, one fallback passed per request (`fallbacks: [\"fake/fb-ok\"]`). Bifrost does not honour Retry-After (backoff 500 ms → 5 s with jitter). Per docs, fallback covers HTTP-level errors and an error in the first SSE event; later stream errors are not retried. Under #7104 S06 goes fail → pass: the silent primary is abandoned at the 30 s request timeout after a single attempt and the fallback serves the answer, where v2.1.0 re-attempted the silent route and ran 130 s past the budget. No other verdict changed, but S08/S14 now surface a raw `Error reading stream: unexpected EOF` where v2.1.0 surfaced Bifrost's own `provider closed the stream before sending a completion marker (upstream connection ended mid-stream)` \u2014 both still score safe, but the mid-stream error text got less informative."
params:
  base_url: http://127.0.0.1:18080/v1
  api_key: failoverbench
  model_format: "fake/{model}"
  extra_body:
    fallbacks: ["{fallback}"]
