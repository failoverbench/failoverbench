name: bifrost
label: "Bifrost v2.1.1 (Docker, sha256:9e65eb4d0b29)"
adapter: endpoint
notes: "Bifrost v2.1.1, the newest released image at run time: `maximhq/bifrost:v2.1.1` @ sha256:9e65eb4d0b292c25aaf46d194c705344f19c833a29e30155038bbe551eac7245 (published 2026-09-09; also what `latest` points at). Custom provider `fake` (base_provider_type openai, base_url = the wall, allow_private_network on). Baseline settings: max_retries 2 (vendor default is 0), request timeout 30 s, stream idle timeout 30 s, one fallback passed per request (`fallbacks: [\"fake/fb-ok\"]`). Bifrost does not honour Retry-After (backoff 500 ms → 5 s with jitter). Per docs, fallback covers HTTP-level errors and an error in the first SSE event; later stream errors are not retried. The header-wait timeout fix (PR #7104, merged 11 Sep) was verified on a dev source build @3a6d793 — S06 went from fail (130.0 s hang) to pass (30.98 s, fallback answered) — but is not in a released image yet, so it is not scored here."
params:
  base_url: http://127.0.0.1:18080/v1
  api_key: failoverbench
  model_format: "fake/{model}"
  extra_body:
    fallbacks: ["{fallback}"]
