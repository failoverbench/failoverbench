[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failoverbench"
version = "0.1.0"
description = "A crash-test lab for LLM gateways and SDKs: a provider that breaks on purpose, and a scorecard of who copes."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Saksham Kumar"}]
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
litellm = ["litellm>=1.50"]
langchain = ["langchain-openai>=0.3", "langchain-core>=0.3"]
dsh = ["deepseek-harness-sdk==0.1.2rc1"]
charts = ["matplotlib>=3.8"]
all = ["openai>=1.40", "litellm>=1.50", "langchain-openai>=0.3", "langchain-core>=0.3", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
failoverbench = "failoverbench.__main__:main"

[tool.setuptools.packages.find]
include = ["failoverbench*"]
